name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deskpilot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 validation
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Node.js 24.22.3
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.3
          cache: npm

      - name: Set up Rust 1.100.0
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@bc2d2e71bd35c5549942babaa51a89c586b981d1
        with:
          workspaces: launcher

      - name: Install Node dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm ci

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Scan working tree for secrets
        run: node scripts/secret-scanner.mjs --worktree

      - name: Run project tests
        run: npm run test:ci

      - name: Test managed launcher policy and credential isolation
        run: node scripts/test-managed-launcher.mjs

      - name: Check Rust formatting
        run: cargo fmt --manifest-path launcher/Cargo.toml --all -- --check

      - name: Check native launcher
        run: cargo check --locked --manifest-path launcher/Cargo.toml --bin deskpilot

      - name: Lint native launcher
        run: cargo clippy --locked --manifest-path launcher/Cargo.toml --bin deskpilot -- -D warnings

      - name: Build native launcher
        run: cargo build --release --locked --manifest-path launcher/Cargo.toml --bin deskpilot

      - name: Install pinned Rust security auditor
        run: cargo install cargo-audit --version 0.23.0 --locked

      - name: Audit Rust dependencies
        working-directory: launcher
        run: cargo audit --file Cargo.lock

      - name: Native launcher self-test
        shell: pwsh
        run: |
          & .\launcher\target\release\deskpilot.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "DeskPilot self-test failed with exit code $LASTEXITCODE" }
          $result = Get-Content (Join-Path $env:LOCALAPPDATA 'DeskPilot\self-test-modern.txt') -Raw
          if ($result.Trim() -ne 'DPAPI_AND_JOB_PASS') { throw "Unexpected self-test result: $result" }
          Write-Host 'DPAPI_AND_JOB_PASS'

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-test-reports
          path: test-results/
          retention-days: 14
